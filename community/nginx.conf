# community.thedzx.site — the community API. Installed by the thedzx skill:
#   ~/.claude/skills/thedzx/scripts/new-site.sh community --conf community/nginx.conf
#
# Rate limits live here, at http level, named for this site only. nginx sets
# a coarse ceiling per client; the app enforces the per-action limits.
#
# Writes are keyed through a map so that GET/HEAD/OPTIONS produce an EMPTY key,
# which limit_req does not count. One location can then carry both limits:
# generous for reading, tight for posting — without guessing from the path.
map $request_method $thedzx_community_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
limit_req_zone $thedzx_community_write_key zone=thedzx_community_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr         zone=thedzx_community_read:10m  rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name community.thedzx.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name community.thedzx.site;

    ssl_certificate     /etc/nginx/ssl/thedzx-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/thedzx-origin.key;

    include /etc/nginx/cf-realip.conf;
    if ($from_cloudflare = 0) { return 403; }

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req_status 429;

    # The ONLY add_header block. A location that sets its own add_header drops
    # every one of these — see the note at the top of the thedzx.site config.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    location / {
        limit_req zone=thedzx_community_read  burst=60 nodelay;
        limit_req zone=thedzx_community_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is already the visitor: cf-realip.conf rewrote it.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
