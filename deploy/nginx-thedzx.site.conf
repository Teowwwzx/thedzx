# thedzx.site — the apex, now serving the blog.
#
# Replaces the previous deliberate-404 block. Two things from that block are
# kept on purpose: the Cloudflare-only guard, and the /cv redirect printed on
# the paper CV.
#
# REMOVED on purpose: `add_header X-Robots-Tag "noindex, nofollow" always;`
# The whole architecture of this site exists so search engines can read the
# posts. Leaving that header in place would make the static-HTML-first design
# pointless. Subdomains keep their own noindex — this is the apex only.
#
# NOTE: nginx here is 1.24, so http2 goes on the listen line — the `http2 on;`
# directive is 1.25.1+. Matching the other site blocks also avoids nginx's
# "protocol options redefined" warning for 0.0.0.0:443.
#
# NOTE: $from_cloudflare comes from /etc/nginx/cf-allow.conf, included by
# comments.thedzx.site. Do NOT include it again here — declaring the geo
# variable twice fails nginx -t.

server {
    listen 80;
    listen [::]:80;
    server_name thedzx.site www.thedzx.site;
    return 301 https://thedzx.site$request_uri;
}

# www -> apex, so there is exactly one canonical host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thedzx.site;

    ssl_certificate     /etc/nginx/ssl/thedzx-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/thedzx-origin.key;

    include /etc/nginx/cf-realip.conf;
    if ($from_cloudflare = 0) { return 403; }

    return 301 https://thedzx.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thedzx.site;

    ssl_certificate     /etc/nginx/ssl/thedzx-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/thedzx-origin.key;

    include /etc/nginx/cf-realip.conf;
    if ($from_cloudflare = 0) { return 403; }

    root /var/www/thedzx.site/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    # The link printed on the paper CV. Delete these two lines to retire it.
    location = /cv  { return 301 https://cv.thedzx.site/; }
    location  /cv/  { return 301 https://cv.thedzx.site/; }

    # Astro emits content-hashed filenames here — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 3D assets land here from stage 1 onward, content-hashed.
    location /models/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        types { model/gltf-binary glb; model/gltf+json gltf; image/ktx2 ktx2; }
        default_type application/octet-stream;
    }

    # OG cards change only when a title or description changes.
    location /og/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # The contract the 3D world polls. Short, so a new post shows up quickly.
    location = /world.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /rss.xml    { default_type application/rss+xml; }
    location = /robots.txt { access_log off; }

    # Astro builds directory-style URLs with trailingSlash: 'always'.
    # try_files resolves /room/ -> /room/index.html, and anything unmatched
    # falls through to the styled 404 page rather than nginx's default.
    location / {
        try_files $uri $uri/ $uri/index.html =404;

        # HTML is revalidated every time; the CDN in front can still cache it.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
