# thedzx.site — the apex, serving the blog.
#
# Replaces the previous deliberate-404 block. Two things from that block are
# kept on purpose: the Cloudflare-only guard, and the /cv redirect printed on
# the paper CV.
#
# REMOVED on purpose: `add_header X-Robots-Tag "noindex, nofollow" always;`
# The whole architecture of this site exists so search engines can read the
# posts. Leaving that header would make the static-HTML-first design pointless.
# Subdomains keep their own noindex — this is the apex only.
#
# ---------------------------------------------------------------------------
# WHY THERE IS EXACTLY ONE add_header BLOCK, AT SERVER LEVEL
#
# nginx's add_header is inherited by a location ONLY IF that location defines
# no add_header of its own. A single `add_header Cache-Control ...` inside
# `location /` therefore silently discards every security header set above it.
#
# An earlier version of this file had per-location Cache-Control headers and
# lost X-Content-Type-Options, Referrer-Policy and X-Frame-Options on 100% of
# real pages while still showing them on /robots.txt — so a spot check looked
# fine. (cv.thedzx.site on this box works around it by repeating the headers
# in each location; this file avoids needing the workaround at all.)
#
# So: Cache-Control is chosen by the $thedzx_cache map below, and every header
# is emitted once, at server level. Do not add an `add_header` or an `expires`
# to any location in this file.
# ---------------------------------------------------------------------------
#
# NOTE: nginx here is 1.24, so http2 goes on the listen line — the `http2 on;`
# directive is 1.25.1+ and fails nginx -t on this box.
#
# NOTE: $from_cloudflare is declared in /etc/nginx/cf-allow.conf, which is
# included by comments.thedzx.site. This file depends on that one being
# enabled. Declaring the geo block twice fails nginx -t, so it cannot simply be
# included here as well. See deploy/install-nginx.sh, which checks for it.

map $uri $thedzx_cache {
    # Content-hashed by the build — safe forever.
    ~^/_astro/          "public, max-age=31536000, immutable";
    ~^/models/          "public, max-age=31536000, immutable";
    # OG cards change only when a title or description changes.
    ~^/og/              "public, max-age=86400";
    # The contract the 3D world polls. Short, so a new post shows up quickly.
    ~^/world\.json$     "public, max-age=300, must-revalidate";
    # HTML and everything else: always revalidate. Cloudflare still caches in
    # front of this.
    default             "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name thedzx.site www.thedzx.site;
    return 301 https://thedzx.site$request_uri;
}

# www -> apex, so there is exactly one canonical host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thedzx.site;

    ssl_certificate     /etc/nginx/ssl/thedzx-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/thedzx-origin.key;

    include /etc/nginx/cf-realip.conf;
    if ($from_cloudflare = 0) { return 403; }

    return 301 https://thedzx.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thedzx.site;

    ssl_certificate     /etc/nginx/ssl/thedzx-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/thedzx-origin.key;

    include /etc/nginx/cf-realip.conf;
    if ($from_cloudflare = 0) { return 403; }

    root /var/www/thedzx.site/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    # THE ONLY add_header BLOCK. See the note at the top of this file.
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Cache-Control          $thedzx_cache                    always;

    # ---- DO NOT ADD A `types { }` BLOCK HERE ----------------------------
    # A `types` block REPLACES nginx's entire MIME table at whatever level it
    # appears — it does not extend it. One at server level wiped mime.types
    # for the whole site, so .html had no known type, fell through to
    # `default_type application/octet-stream`, and every browser DOWNLOADED
    # the homepage instead of rendering it. CSS, RSS and world.json too.
    #
    # `.glb` and `.ktx2` are genuinely absent from nginx's table, but the way
    # to add them is a per-extension location with `default_type` (which only
    # applies when the extension is unknown), leaving mime.types intact.
    # These set no add_header, so they still inherit the block above.
    location ~* \.glb$   { default_type model/gltf-binary; }
    location ~* \.gltf$  { default_type model/gltf+json; }
    location ~* \.ktx2$  { default_type image/ktx2; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml
               application/atom+xml;

    # The link printed on the paper CV. Delete these two lines to retire it.
    location = /cv  { return 301 https://cv.thedzx.site/; }
    location  /cv/  { return 301 https://cv.thedzx.site/; }

    # Astro builds directory-style URLs with trailingSlash: 'always', so
    # /room/ resolves to /room/index.html. Anything unmatched falls through to
    # the styled 404 rather than nginx's default page.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 403 404 /404.html;
    location = /404.html { internal; }
}
